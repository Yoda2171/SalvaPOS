<div class="container vh-100">
    <div class="row d-flex align-items-center justify-content-center mt-2 border ">
      @for(producto of productos; track producto.id) {
        <div class="card col-3 m-2 text-center" style="width: 300px; height: 400px;">
          <!-- Imagen con tamaño uniforme -->
          <img 
            src={{producto.img}} 
            class="card-img-top" 
            style="height: 200px; object-fit: fill;" 
            alt="Imagen del producto">
          <div class="card-body d-flex flex-column justify-content-between">
            <p class="card-text"><strong>{{producto.name}}</strong></p>
            <p class="card-text"><strong>{{producto.desc}}</strong></p>
            <p class="card-text"><strong>${{producto.precio}}</strong></p>
            <!-- Botón -->
            <button 
              (click)="agregar(producto)" 
              class="btn btn-primary mt-auto">
              Agregar al carro
            </button>
          </div>
        </div>
      }
    </div>
  </div>
