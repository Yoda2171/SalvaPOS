<div class="container mt-4">
  <h2 class="text-center">Reporte de Métodos de Pago</h2>
  <form [formGroup]="dateForm">
    <div class="row mb-3">
      <div class="col">
        <label for="startDate">Fecha de Inicio</label>
        <input
          type="date"
          id="startDate"
          formControlName="startDate"
          class="form-control"
        />
      </div>
      <div class="col">
        <label for="endDate">Fecha de Fin</label>
        <input
          type="date"
          id="endDate"
          formControlName="endDate"
          class="form-control"
        />
      </div>
    </div>
  </form>
  <div *ngIf="loading$ | async" class="text-center">
    <div class="spinner-border" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
  <table
    *ngIf="!(loading$ | async) && metodoPagoData.length > 0"
    class="table table-striped mt-4"
  >
    <thead>
      <tr>
        <th>Método de Pago</th>
        <th>Cantidad de Ventas</th>
        <th>Total Vendido</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of metodoPagoData">
        <td>{{ item.nombreMetodoPago }}</td>
        <td>{{ this.formatCurrency(item.cantidadVentas) }}</td>
        <td>{{ this.formatCurrency(item.totalVendido) }}</td>
      </tr>
    </tbody>
  </table>
  <div
    class="d-flex justify-content-center"
    [hidden]="(loading$ | async) || metodoPagoData.length === 0"
  >
    <div style="width: 60%">
      <canvas #barChart></canvas>
    </div>
  </div>
</div>
