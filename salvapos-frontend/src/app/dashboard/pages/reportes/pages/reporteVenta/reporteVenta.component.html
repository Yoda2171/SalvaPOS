<div class="container mt-4">
  <h2 class="text-center">Informe de Ventas</h2>
  <form [formGroup]="dateForm">
    <div class="row mb-3">
      <div class="col">
        <label for="startDate">Fecha de Inicio</label>
        <input
          type="date"
          id="startDate"
          formControlName="startDate"
          class="form-control"
        />
      </div>
      <div class="col">
        <label for="endDate">Fecha de Fin</label>
        <input
          type="date"
          id="endDate"
          formControlName="endDate"
          class="form-control"
        />
      </div>
    </div>
  </form>
  <div *ngIf="loading$ | async" class="text-center">
    <div class="spinner-border" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
  <table
    *ngIf="!(loading$ | async) && ventasData.length > 0"
    class="table table-striped mt-4"
  >
    <thead>
      <tr>
        <th>Fecha de Venta</th>
        <th>Cantidad de Ventas</th>
        <th>Total Vendido</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let venta of ventasData">
        <td>{{ formatDate(venta.fechaVenta) }}</td>
        <td>{{ formatCurrency(venta.cantidadVentas) }}</td>
        <td>{{ formatCurrency(venta.totalVendido) }}</td>
      </tr>
    </tbody>
  </table>
  <!-- Gráfico inicialmente oculto -->
  <div class="d-flex justify-content-center" [hidden]="!showChart">
    <div style="width: 80%">
      <canvas #lineChart></canvas>
    </div>
  </div>
</div>
